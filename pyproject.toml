[project]
name = "copy-pdf"
description="Transform scanned PDF's into searchable and copyable documents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
]
